# Sumika TypeScript 既定設定ファイル
# このファイルは「既定値の一覧」です。ユーザー設定は config/settings.toml に書き、
# 指定しなかった項目はここ（および schema.ts の DEFAULT_CONFIG）の値が使われます。

[audio]
# STT / VAD が前提とするサンプリングレート（Whisper は 16kHz 必須）
sample_rate = 16000
# VAD のフレーム長（ms）
frame_ms = 20
# 発話検出時に遡って取り込むプリロール（ms）
pre_roll_ms = 300
# 1 発話の最大長（秒）。長めの文でも語尾が切れないよう 30 秒
max_record_seconds = 30
# 無音とみなす RMS しきい値（0..1）。タイピング音などの環境音を拾わない下限
silence_threshold = 0.02
# この秒数だけ無音が続いたら発話終了（考えながら話す間で切れないよう 1.5 秒）
silence_duration = 1.5
# 発話開始までの待ち時間（秒）
no_speech_timeout = 3.0
# 入力ゲイン（レベル計算に適用）
input_gain = 1.0
# 出力音量（0..1）
output_volume = 1.0
# 入力デバイス名（空なら ffmpeg で自動検出）
input_device = ""
# 出力デバイス名（予約）
output_device = ""
# レベルの指数移動平均係数
smoothing_alpha = 0.1
# 暗騒音に対する相対しきい値の倍率
relative_threshold_multiplier = 2.0
# 相対しきい値の上限（環境音でしきい値が跳ね上がらないようにする）
silence_threshold_max = 0.06
# 起動時キャリブレーション時間（秒）
calibration_duration = 0.5
# 連続何フレームで発話開始と判定するか（3 = 60ms。タイピング等の一発音を弾く）
debounce_frames = 3
# ffmpeg 実行パス（PATH で解決できない場合に指定）
ffmpeg_path = ""
# 再生バックエンド: auto | ffplay | soundplayer
player = "auto"
# 録音セッションの間隔（ms）。前の ffmpeg がマイクを解放するのを待つ
device_settle_ms = 250
# 音声入力の方式: browser（ブラウザのマイク） / server（ffmpeg で録音）
# browser では画面の「聞き取り開始」から録音します（ffmpeg 不要）
input_mode = "browser"
# 再生の出力先: server（ffplay）/ browser（WebAudio）
# 口パク・表情は browser 再生でのみ動きます（server では tts_audio を送らないため）
playback_target = "browser"

[wakeword]
# ウェイクワードモデル（将来のエンジン用・現在は未使用）
wakeword_path = []
threshold = 0.55
avg_threshold = 0.4
min_scores = 3

[conversation]
# 起動直後に自動で聞き取りを開始するか
auto_start = false
followup_enabled = true
max_followup_turns = 3
followup_timeout_seconds = 6.0
# 応答直後にマイクを開くまでの待ち（エコー防止, ms）
followup_guard_ms = 400
# フォローアップ回数の上限に達しても聞き取りを続ける（停止を押すまで待機）
keep_listening = true
# バージイン（再生中の割り込み）。スピーカー出力をマイクが拾うと自分の声で割り込むため既定は無効。
# 有効にする場合はヘッドホン使用を推奨（ブラウザのエコーキャンセルは ffplay の再生音には効きません）
barge_in_enabled = false
# バージイン判定の RMS しきい値（0..1）
barge_in_min_score = 0.08
# 応答言語: ja（日本語） / en（英語）。STT・プロンプト・TTS・UI が追従する
language = "en"
reset_history_on_language_change = false

[stt]
# 既定は q5_0（約 550MB。VRAM 4GB でも動く）。GPU に余裕があれば f16（高精度・1.5GB）も使えます。
# q5_0 は `whisper.cpp/whisper-quantize.exe models/ggml-large-v3-turbo.bin models/ggml-large-v3-turbo-q5_0.bin q5_0` で生成できます。
model_path = "models/ggml-large-v3-turbo-q5_0.bin"
# CUDA 版では main.exe が廃止され whisper-cli.exe に統合されています。
# scripts/setup-whisper-cuda.ps1 は互換のため whisper-cli.exe を main.exe としても配置します。
binary_path = "whisper.cpp/main.exe"
language = "ja"
use_gpu = true
flash_attn = true
beam_size = 1
threads = 4
timeout_seconds = 60
initial_prompt = ""

# --- 幻聴（無音・雑音に対して定型句を出力する現象）対策 ---
# 非音声トークンを抑制する（-sns）
suppress_non_speech = true
# 直前の文脈トークン保持数（-mc）。0 で文脈を引き継がない＝同文の繰り返しを防ぐ
max_context = 0
# 「無音」と判定する確率しきい値（-nth）。大きいほど幻聴が出にくい
no_speech_thold = 0.6
# 区間の no_speech_prob がこの値以上なら破棄（JSON 出力を利用）
drop_no_speech_prob = 0.75
# 区間の avg_logprob がこの値未満なら破棄（JSON 出力を利用）
drop_avg_logprob = -1.0
# 定型句の幻聴（「ご視聴ありがとうございました」等）を破棄する
filter_hallucinations = true
# この RMS（0..1）未満の入力は無音として認識しない（0 で無効）
min_input_rms = 0.002

# --- 認識エンジン ---
# whisper: whisper.cpp（model_path / binary_path を使用）
# sherpa:  sherpa-onnx（下の sherpa_* を使用。GPU 不要・幻聴なしの CTC 系モデル）
# 既定は sherpa。whisper に戻す場合は engine = "whisper" を指定します。
engine = "sherpa"
# モデルディレクトリ（*.onnx と tokens.txt）。scripts/setup-sherpa.ps1 で取得できます
sherpa_model_dir = "models/sherpa-onnx-nemo-parakeet-tdt_ctc-0.6b-ja-35000-int8"
# nemo_ctc（単一 model.onnx） / nemo_transducer / sense_voice / zipformer_transducer
sherpa_model_type = "nemo_ctc"
# 推論プロバイダ（cpu。GPU 版 onnxruntime を使う場合のみ cuda など）
sherpa_provider = "cpu"
# SenseVoice の言語指定（auto / ja / en / zh / ko / yue）
sherpa_language = "ja"

# --- 英語モード（conversation.language = "en"）の上書き ---
# 日本語専用モデル（nemo_ctc など）を避け、whisper の多言語モデルへ切り替える。
# 未指定のキーは日本語モードと同じ値を使います。
[stt.en]
engine = "whisper"
language = "en"
sherpa_language = "en"

[llm]

endpoint = "http://127.0.0.1:11434"
model = "gemma4:e2b-it-qat"
character_file = "config/characters/sakura.toml"
temperature = 0.7
max_tokens = 512
response_timeout_seconds = 60
# モデルの読み込みを待つ上限（秒）。切替直後の初回は読み込みに数十秒かかるため、
# 応答タイムアウト（60 秒）で打ち切ると Ollama 側の読み込みごと中止され、以後ずっと失敗します
model_load_timeout_seconds = 180
# プロンプトに含める直近ターン数
history_turns = 6
keep_alive = "30m"
num_ctx = 4096
# 英語モードのキャラクター定義（空なら日本語と同じファイルを使う）
character_file_en = "config/characters/sakura.en.toml"

[tts]
# 既定は GPT-SoVITS。日本語モードは [tts.ja]、英語モードは [tts.en] が上書きする
engine = "gpt_sovits"
endpoint = "http://127.0.0.1:9880"
speaker_id = 2
speed = 1.0
pitch = 0.0
volume = 1.0
timeout_seconds = 60
split_sentences = true
prefetch_depth = 2
min_sentence_chars = 4
max_sentence_chars = 24

# --- 日本語モードの上書き（未指定キーは [tts] 直下の値を使う） ---
# B 案（日英で同じ声）のため、既定では [tts.en] と同じ GPT-SoVITS と参照音声を使う。
[tts.ja]
engine = "gpt_sovits"
endpoint = "http://127.0.0.1:9880"
reference_wav = "assets/voices/ref_ja.wav"
reference_text = "こんにちは。私は音声アシスタントです。今日も元気に会話しましょう。"
prompt_lang = "ja"

# --- 英語モードの読み上げ（conversation.language = "en" のとき使う） ---
# engine: openai_speech（OpenAI 互換 /v1/audio/speech） | gpt_sovits（api_v2） | voicevox
# 同じ声質で日英を読み上げたい場合は gpt_sovits + 参照音声を推奨（docs/TTS_MULTILINGUAL.md）
[tts.en]
engine = "gpt_sovits"
endpoint = "http://127.0.0.1:9880"
model = "kokoro"
voice = "af_heart"
speaker_id = 0
speed = 1.0
# GPT-SoVITS 用（engine = "gpt_sovits" のとき）。1〜5 秒の参照音声とその書き起こし
reference_wav = "assets/voices/ref_ja.wav"
reference_text = "こんにちは。私は音声アシスタントです。今日も元気に会話しましょう。"
prompt_lang = "ja"

# --- 声質変換（既定で有効） ---
# RVC などの変換ワーカー（POST /convert, base64 WAV）へ読み上げを通す。
# モデル未設定・ワーカー未起動なら自動でスキップして素の声で読み上げる。
[tts.voice_conversion]
enabled = true
endpoint = "http://127.0.0.1:9890"
model_path = "models/imadaMio.pth"
index_path = "models/imadaMio_v2.index"
pitch = 0
f0_method = "rmvpe"
index_rate = 0
protect = 0.33
timeout_seconds = 60

[rag]
# 未実装（設定のみ・拡張ポイント）
enabled = true
data_dir = "data"
embedding_model = "nomic-embed-text"
top_k = 3
similarity_threshold = 0.3

[recipe_db]
# 未実装（設定のみ・拡張ポイント）
enabled = true
db_path = "data/recipedb/recipes.sqlite"
master_dir = "data/recipedb"

[music]
# 未実装（設定のみ・拡張ポイント）
spotify_client_id = ""
spotify_redirect_uri = "http://localhost:8765/callback"
local_music_dir = "music"
default_volume = 0.7
volume_step = 0.1
duck_on_wakeword = true
duck_volume = 0.15

[gui]
user_name = "You"
debug_mode = false
trace_turns = false
outfit = "home"
layout = "chat"
caption_enabled = true
caption_font_size = 34

[apps.proactive_speech.categories.briefing]
enabled = true
voice = true
ui = true

[apps.proactive_speech.categories.reminder]
enabled = true
voice = true
ui = true

[apps.proactive_speech.categories.alert]
enabled = true
voice = true
ui = true

[apps.proactive_speech.categories.family_memo]
enabled = true
voice = false
ui = true

[apps.proactive_speech.categories.system]
enabled = true
voice = false
ui = true

[apps.proactive_speech.triggers.demo]
enabled = false
fire_time = "07:00"
text = "プロアクティブ発話デモ: 設定通りに発火しました"

[apps.proactive_speech.triggers.morning_briefing]
enabled = false
fire_time = "07:00"
include_weather = true
include_calendar = true
include_shopping = true
include_news = false
news_url = "http://127.0.0.1:5000"
news_new_only = true

[apps.home_assistant]
base_url = ""
token = ""


[avatar]
enabled = true
model_path = "Live2DModels/hiyori_vts/hiyori.model3.json"
scale = 1
